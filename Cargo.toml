[package]
name = "smuggle"
version = "0.3.0"
edition = "2024"
description = "Smuggle local npm packages into your projects — no symlinks, no lockfile pollution"
license = "MIT"
keywords = ["npm", "pnpm", "yarn", "local", "publish"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console = "0.15"
cliclack = "0.4"
ignore = "0.4"
notify = { version = "8", features = ["macos_fsevent"] }
filetime = "0.2"
flate2 = "1"
tar = "0.4"
ctrlc = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "signal", "io-std", "io-util"] }
hyper = { version = "1.11.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio", "client-legacy"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
rcgen = { version = "0.14.9", features = ["pem", "x509-parser"] }
rustls-pemfile = "2.2.0"
libc = "0.2.189"
webpki-roots = "1.0.9"
time = { version = "0.3.55", default-features = false, features = ["std"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "ring", "webpki-tokio", "tls12"] }
tower-service = "0.3.3"
sha2 = "0.11.0"
sha1 = "0.11.0"
base64 = "0.23.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
