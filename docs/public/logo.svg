<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="sm-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2691e"/>
      <stop offset="1" stop-color="#a0360b"/>
    </linearGradient>
    <linearGradient id="sm-top" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#cd853f"/>
      <stop offset="1" stop-color="#e8a070"/>
    </linearGradient>
    <linearGradient id="sm-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b2f0a"/>
      <stop offset="1" stop-color="#6b2407"/>
    </linearGradient>
    <linearGradient id="sm-tape-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a0360b"/>
      <stop offset="1" stop-color="#7a2807"/>
    </linearGradient>
  </defs>

  <!-- Soft ground shadow -->
  <ellipse cx="68" cy="118" rx="48" ry="5" fill="#000" opacity="0.22"/>

  <!-- Right face -->
  <path d="M96 48 L96 112 L112 96 L112 32 Z"
        fill="url(#sm-right)" stroke="#4a1505" stroke-width="2" stroke-linejoin="round"/>

  <!-- Top face -->
  <path d="M24 48 L40 32 L112 32 L96 48 Z"
        fill="url(#sm-top)" stroke="#4a1505" stroke-width="2" stroke-linejoin="round"/>

  <!-- Tape strip across the top, drawn on the top face -->
  <path d="M52 48 L68 32 L84 32 L68 48 Z"
        fill="#b7410e" stroke="#4a1505" stroke-width="1.2" stroke-linejoin="round" opacity="0.85"/>

  <!-- Front face -->
  <path d="M24 48 L96 48 L96 112 L24 112 Z"
        fill="url(#sm-front)" stroke="#4a1505" stroke-width="2" stroke-linejoin="round"/>

  <!-- Tape strip down the front -->
  <path d="M52 48 L68 48 L68 112 L52 112 Z"
        fill="url(#sm-tape-front)" stroke="#4a1505" stroke-width="1.2" stroke-linejoin="round" opacity="0.85"/>

  <!-- {} braces stamped on the front -->
  <g stroke="#fff5e6" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M50 64 Q42 64 42 71 L42 77 Q42 80 36 80 Q42 80 42 83 L42 89 Q42 96 50 96"/>
    <path d="M70 64 Q78 64 78 71 L78 77 Q78 80 84 80 Q78 80 78 83 L78 89 Q78 96 70 96"/>
  </g>
</svg>
