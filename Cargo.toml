[package]
name = "smuggle"
version = "0.1.0"
edition = "2024"
description = "Smuggle local npm packages into your projects — no symlinks, no lockfile pollution"
license = "MIT"
keywords = ["npm", "pnpm", "yarn", "local", "publish"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dialoguer = "0.11"
indicatif = "0.17"
ignore = "0.4"
notify = { version = "8", features = ["macos_fsevent"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
ctrlc = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
