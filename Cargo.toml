[package]
name = "smuggle"
version = "0.2.0"
edition = "2024"
description = "Smuggle local npm packages into your projects — no symlinks, no lockfile pollution"
license = "MIT"
keywords = ["npm", "pnpm", "yarn", "local", "publish"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console = "0.15"
cliclack = "0.4"
ignore = "0.4"
notify = { version = "8", features = ["macos_fsevent"] }
filetime = "0.2"
flate2 = "1"
tar = "0.4"
ctrlc = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
