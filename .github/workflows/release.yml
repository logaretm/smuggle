name: Release

on:
  push:
    tags:
      - "v*"
  # Called by publish.yml right after it tags the release commit, because GitHub
  # does not fire workflows for tags pushed with GITHUB_TOKEN. `tag` is what
  # every job checks out, so the build is pinned to the tagged commit either way.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm_dir: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            npm_dir: darwin-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            npm_dir: linux-arm64-gnu
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm_dir: linux-x64-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../smuggle-${{ matrix.target }}.tar.gz smuggle
          cd ../../..

      - name: Prepare npm package
        shell: bash
        run: |
          mkdir -p npm/${{ matrix.npm_dir }}/bin
          cp target/${{ matrix.target }}/release/smuggle npm/${{ matrix.npm_dir }}/bin/smuggle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smuggle-${{ matrix.target }}
          path: |
            smuggle-${{ matrix.target }}.tar.gz
            npm/${{ matrix.npm_dir }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Notes come from the CHANGELOG section the release PR carried, so what
      # npm ships, what the changelog says, and what GitHub shows all come from
      # the same changesets. A tag cut before changesets existed, or by hand,
      # has no matching section, so fall back to generated notes.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Everything between the first `## ` heading and the next one.
          awk '/^## /{ n++ } n == 1' npm/smuggle-cli/CHANGELOG.md 2>/dev/null \
            | tail -n +2 > notes.md || true

          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            "${notes[@]}" \
            artifacts/*.tar.gz

  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish platform packages
        run: |
          for dir in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu; do
            cd "artifacts/npm/$dir"
            npm publish --provenance
            cd "$GITHUB_WORKSPACE"
          done

      - name: Publish root package
        run: |
          cd npm/smuggle-cli
          npm publish --provenance
